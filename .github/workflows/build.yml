name: Windows-exe bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Syntax-/Importtest
        run: python -c "import weldwatch.main, weldwatch.gui"
      - name: Tests (Projektdatei, Zusammenführen, Excel nur nach Prüfung)
        run: python -m unittest discover -s tests -v
      - name: Rauchtest Prüf-Fenster (echtes Tk)
        timeout-minutes: 5
        run: python tests/gui_smoke.py
      - name: exe bauen
        run: >
          pyinstaller --noconfirm --onedir --noconsole --name WeldWatch
          --collect-all pypdfium2 --collect-all pdfplumber --collect-all pdfminer --collect-all cv2 --collect-all tkinterdnd2
          weldwatch.py
      - name: Konfiguration und Ordner ergänzen
        shell: pwsh
        run: |
          Copy-Item weldwatch_config.json dist/WeldWatch/
          New-Item -ItemType Directory -Force dist/WeldWatch/vorlage | Out-Null
          Copy-Item vorlage/README.txt dist/WeldWatch/vorlage/
          Copy-Item README.md dist/WeldWatch/
      - name: Tesseract (OCR) mitliefern
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          $src = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$src\tesseract.exe")) { throw "Tesseract nicht gefunden in $src" }
          Copy-Item $src dist/WeldWatch/tesseract -Recurse
          & dist/WeldWatch/tesseract/tesseract.exe --version
          if (-not (Test-Path dist/WeldWatch/tesseract/tessdata/eng.traineddata)) { throw "eng.traineddata fehlt" }
      - name: exe-Start prüfen
        shell: pwsh
        run: |
          dist/WeldWatch/WeldWatch.exe --help
          if ($LASTEXITCODE -ne 0) { throw "exe --help fehlgeschlagen" }
      - name: Prüf-Fenster der gebauten exe starten (Selbsttest)
        shell: pwsh
        timeout-minutes: 3
        run: |
          $env:WELDWATCH_SELBSTTEST = "1"
          $p = Start-Process -FilePath dist/WeldWatch/WeldWatch.exe -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Prüf-Fenster startet nicht (Exitcode $($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: WeldWatch-windows
          path: dist/WeldWatch
      - name: Release bereitstellen (schneller Download über Releases)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/WeldWatch -DestinationPath WeldWatch-windows.zip -CompressionLevel Optimal
          $kurz = $env:GITHUB_SHA.Substring(0, 7)
          $notes = "Automatischer Build von Commit $kurz. ZIP entpacken und WeldWatch.exe starten. Ergebnisse sind Vorschläge zur Prüfung durch eine Person."
          if ($env:GITHUB_REF -like "refs/tags/*") {
            gh release create $env:GITHUB_REF_NAME WeldWatch-windows.zip --title "WeldWatch $env:GITHUB_REF_NAME" --notes $notes --verify-tag
          } else {
            # Rollierendes Release "latest": wird bei jedem Build ersetzt
            gh release view latest *> $null
            if ($LASTEXITCODE -eq 0) { gh release delete latest --cleanup-tag --yes }
            gh release create latest WeldWatch-windows.zip --title "WeldWatch (aktueller Stand)" --notes $notes --target $env:GITHUB_SHA --prerelease
          }
