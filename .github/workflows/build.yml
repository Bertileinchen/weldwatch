name: Windows-exe bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Syntax-/Importtest
        run: python -c "import weldwatch.main"
      - name: exe bauen
        run: >
          pyinstaller --noconfirm --onedir --name WeldWatch
          --collect-all pypdfium2 --collect-all pdfplumber --collect-all pdfminer --collect-all cv2
          weldwatch.py
      - name: Konfiguration und Ordner ergänzen
        shell: pwsh
        run: |
          Copy-Item weldwatch_config.json dist/WeldWatch/
          New-Item -ItemType Directory -Force dist/WeldWatch/vorlage | Out-Null
          Copy-Item vorlage/README.txt dist/WeldWatch/vorlage/
          Copy-Item README.md dist/WeldWatch/
      - name: Tesseract (OCR) mitliefern
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          $src = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$src\tesseract.exe")) { throw "Tesseract nicht gefunden in $src" }
          Copy-Item $src dist/WeldWatch/tesseract -Recurse
          & dist/WeldWatch/tesseract/tesseract.exe --version
          if (-not (Test-Path dist/WeldWatch/tesseract/tessdata/eng.traineddata)) { throw "eng.traineddata fehlt" }
      - name: exe-Start prüfen
        run: dist/WeldWatch/WeldWatch.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: WeldWatch-windows
          path: dist/WeldWatch
